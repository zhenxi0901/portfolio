name: deploy

# Promotes the image CI built and tested for a commit on main to Cloud Run, by digest. Nothing is
# built here. Keyless: GitHub OIDC -> Workload Identity Federation.
# Needs repository variables GCP_PROJECT, GCP_REGION, WIF_PROVIDER, DEPLOYER_SA (from `terraform output`).
on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # A push to main in this repository whose CI passed. The branch filter alone is not enough: it
    # also matches a pull request from a fork whose own branch is called main. A manual run deploys
    # main's head, and only if CI has already pushed a tested image for it (checked below).
    if: >-
      vars.GCP_PROJECT != '' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/portfolio/site
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { ref: "${{ env.SHA }}" }
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Find the image CI tested
        id: image
        run: |
          digest=$(gcloud artifacts docker images describe "$IMAGE:$SHA" --format='value(image_summary.digest)' 2>/dev/null) || true
          if [ -z "$digest" ]; then
            echo "::error::No image for $SHA. CI pushes one only after every check passes; there is nothing tested to deploy."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy the digest CI tested
        run: |
          gcloud run deploy portfolio \
            --region ${{ vars.GCP_REGION }} \
            --image "$IMAGE@${{ steps.image.outputs.digest }}" \
            --quiet
      - name: Verify
        run: |
          URL=$(gcloud run services describe portfolio --region ${{ vars.GCP_REGION }} --format 'value(status.url)')
          curl -fsS "$URL/api/health"
          curl -fsS "$URL/api/status" | grep "${SHA:0:7}" >/dev/null
          bash scripts/smoke.sh "$URL"
